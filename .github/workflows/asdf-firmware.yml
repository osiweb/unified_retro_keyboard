name: asdf-firmware
on:
  push:
    branches:
      - main
      - asdf-build-test
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    container: { image: alpine }
    defaults:
      run:
        shell: sh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: install_git_and_bash
        run: apk add bash git rsync
      - name: checkout
        uses: actions/checkout@v4
      - run: apk add gcc-avr binutils-avr avr-libc
      - run: apk add cmake make
      - name: Extract project version
        id: version
        run: |
          cd firmware/asdf
          VER=$(bash ./version.sh)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Project version: $VER"
      - name: Verify tag matches CMakeLists VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CMAKE_VERSION="${{ steps.version.outputs.version }}"
          if [ "$TAG_VERSION" != "$CMAKE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match CMakeLists VERSION ($CMAKE_VERSION)" >&2
            exit 1
          fi
      - run: cd firmware/asdf; /bin/bash ./make-targets.sh -a -i -s
      - name: Upload built ELFs
        uses: actions/upload-artifact@v4
        with:
          name: asdf-elfs
          path: firmware/asdf/build-atmega*/src/asdf-v*-*.elf
          retention-days: 7
      - name: Upload built HEX
        uses: actions/upload-artifact@v4
        with:
          name: asdf-hex
          path: firmware/asdf/dist/asdf-v*-*.hex
          retention-days: 7
      - name: Upload docs/dist for deploy
        uses: actions/upload-artifact@v4
        with:
          name: asdf-docs-dist
          path: |
            firmware/asdf/docs/source/
            firmware/asdf/dist/
          retention-days: 7

  host_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential
      - name: Run host unit tests
        run: cd firmware/asdf && bash ./make-targets.sh -t test

  integration_test:
    needs: build_firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential simavr libsimavr-dev libelf-dev pkg-config
      - name: Download ELFs
        uses: actions/download-artifact@v4
        with:
          name: asdf-elfs
          path: firmware/asdf/
      - name: Re-layout downloaded ELFs
        run: |
          cd firmware/asdf
          VER="${{ needs.build_firmware.outputs.version }}"
          for t in atmega328p atmega168p atmega640 atmega1280 atmega2560; do
            mkdir -p build-$t/src
            mv "asdf-v${VER}-$t.elf" build-$t/src/ 2>/dev/null || \
              find . -maxdepth 4 -name "asdf-v${VER}-$t.elf" \
                -not -path "./build-$t/*" \
                -exec mv {} build-$t/src/ \; 2>/dev/null || true
          done
      - name: Run simavr integration tests
        run: cd firmware/asdf && bash ./make-targets.sh -t simavr_test
      - name: Upload VCD on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simavr-vcd-traces
          path: firmware/asdf/build-simavr_test/test/simavr/*.vcd
          retention-days: 14

  build_docs:
    needs: [build_firmware, host_test, integration_test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: { image: alpine }
    defaults:
      run:
        shell: sh
    steps:
      - name: install_git_and_bash
        run: apk add bash git rsync zip
      - uses: actions/checkout@v4
      - run: apk add python3 py3-pip
      - run: pip install --break-system-packages -U sphinx sphinx-rtd-theme sphinx-autodoc-typehints
      - run: pip install --break-system-packages -U sphinxcontrib-napoleon
      - run: pip install --break-system-packages -U toml
      - name: Download docs/dist
        uses: actions/download-artifact@v4
        with:
          name: asdf-docs-dist
          path: firmware/asdf/
      - run: mkdir public; touch public/.nojekyll
      - run: sphinx-build -b html firmware/asdf/docs/source public
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
      - name: Archive docs for release
        run: |
          VER="${{ needs.build_firmware.outputs.version }}"
          zip -r "asdf-v${VER}-docs.zip" public
      - name: Upload docs archive
        uses: actions/upload-artifact@v4
        with:
          name: asdf-docs-archive
          path: asdf-v*-docs.zip
          retention-days: 7

  release:
    needs: [build_firmware, build_docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download ELFs
        uses: actions/download-artifact@v4
        with:
          name: asdf-elfs
          path: release-assets/elfs
      - name: Download HEX files
        uses: actions/download-artifact@v4
        with:
          name: asdf-hex
          path: release-assets/hex
      - name: Download docs archive
        uses: actions/download-artifact@v4
        with:
          name: asdf-docs-archive
          path: release-assets/docs
      - name: Flatten release assets
        run: |
          mkdir -p release-assets/flat
          find release-assets/elfs -name "*.elf" -exec cp {} release-assets/flat/ \;
          find release-assets/hex  -name "*.hex" -exec cp {} release-assets/flat/ \;
          find release-assets/docs -name "*.zip" -exec cp {} release-assets/flat/ \;
          ls -la release-assets/flat
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/flat/*
          generate_release_notes: true
          fail_on_unmatched_files: true
